<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إدارة العملاء والمديونيات - تك زون للإلكترونيات</title>
<link href="app.css" rel="stylesheet"/>
<script>if(localStorage.getItem('tz-theme')==='dark')document.documentElement.classList.add('dark');</script>
</head>
<body id="shell" class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-200 h-screen overflow-hidden flex flex-col md:flex-row">
<main class="flex-1 overflow-y-auto p-6 md:p-8">
  <div class="max-w-6xl mx-auto">
    <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white">إدارة العملاء والمديونيات</h1>
        <p class="text-slate-500 dark:text-slate-400">متابعة حسابات العملاء الآجلة، كشوف الحساب، وسندات القبض</p>
      </div>
      <button id="btn-add" class="px-6 py-3 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/30 hover:bg-primary-dark transition-all flex items-center gap-2 active:scale-95">
        <span class="material-icons-outlined">person_add</span>
        إضافة عميل جديد
      </button>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3 flex-1 max-w-xl">
          <div class="relative flex-1">
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
              <span class="material-icons-outlined text-sm">search</span>
            </div>
            <input id="q" class="w-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg py-2 pr-10 pl-4 text-sm outline-none focus:ring-2 focus:ring-primary" placeholder="بحث بالاسم أو رقم الموبايل..."/>
          </div>
          <label class="inline-flex items-center gap-2 text-sm font-medium px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 cursor-pointer shrink-0">
            <input type="checkbox" id="debt-only" class="w-4 h-4 accent-red-600"/>
            <span>عليه مديونية فقط</span>
          </label>
        </div>
        <div class="text-sm text-slate-500 dark:text-slate-400 font-medium">
          إجمالي العملاء: <span id="total-count" class="font-bold text-slate-800 dark:text-white">0</span>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-right border-collapse">
          <thead>
            <tr class="bg-slate-50 dark:bg-slate-900/50 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">
              <th class="px-6 py-4 font-semibold">الاسم</th>
              <th class="px-6 py-4 font-semibold">رقم الهاتف</th>
              <th class="px-6 py-4 font-semibold">إجمالي الآجل</th>
              <th class="px-6 py-4 font-semibold">المسدد</th>
              <th class="px-6 py-4 font-semibold">المديونية المتبقية</th>
              <th class="px-6 py-4 font-semibold text-center">الإجراءات</th>
            </tr>
          </thead>
          <tbody id="cust-list" class="divide-y divide-slate-100 dark:divide-slate-700">
            <!-- Rows injected here -->
          </tbody>
        </table>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center gap-4" id="pagination">
        <span class="text-sm text-slate-500 dark:text-slate-400" id="page-info"></span>
        <div class="flex gap-2">
          <button id="prev" class="px-3 py-1.5 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700">السابق</button>
          <button id="next" class="px-3 py-1.5 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700">التالي</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Add/Edit Customer -->
  <div id="cust-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <h3 class="text-xl font-bold mb-6" id="modal-title">إضافة عميل جديد</h3>
      <form id="cust-form" class="space-y-4">
        <input type="hidden" id="f-id"/>
        <div>
          <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">اسم العميل *</label>
          <input id="f-name" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary" placeholder="مثلاً: محمد أحمد"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">رقم الهاتف</label>
          <input id="f-phone" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary font-num" placeholder="010xxxxxxxx"/>
        </div>
        <div class="flex gap-3 pt-4">
          <button type="button" id="modal-cancel" class="flex-1 py-3 rounded-xl border border-slate-200 dark:border-slate-600 font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">إلغاء</button>
          <button type="submit" class="flex-1 py-3 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/30 hover:bg-primary-dark transition-all">حفظ</button>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="app.js"></script>
<script>
(async () => {
  const user = await pageInit('customers', { perm: ['customers_view', 'customers_edit'] });
  if (!user) return;
  
  const $ = (id) => document.getElementById(id);
  const canEdit = hasPerm('customers_edit');
  const canDelete = hasPerm('customers_delete');
  if (!canEdit) $('btn-add').classList.add('hidden');

  let currentOffset = 0, lastTotal = 0;
  const LIMIT = 50;

  async function loadCustomers() {
    const q = $('q').value.trim();
    const debtOnly = $('debt-only').checked;
    const res = q
      ? await guard(() => api('customers_search', { q }))
      : await guard(() => api('customers_list', { limit: LIMIT, offset: currentOffset, debt_only: debtOnly }));
    
    if (!res) return;
    let rows = q ? res : res.rows;
    if (q && debtOnly) rows = rows.filter((c) => (c.debt || 0) > 0);
    const total = q ? rows.length : res.total;
    lastTotal = total;
    
    $('total-count').textContent = total;
    $('page-info').textContent = total ? `عرض ${q ? 1 : currentOffset + 1} إلى ${q ? rows.length : Math.min(total, currentOffset + LIMIT)} من ${n(total)}` : 'لا نتائج';
    const list = $('cust-list');
    list.innerHTML = rows.length ? rows.map(c => {
      const debt = c.debt || 0;
      return `
      <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors cursor-pointer" onclick="location.href='customer_details.html?id=${c.id}'">
        <td class="px-6 py-4 font-medium text-primary hover:underline">${esc(c.name)}</td>
        <td class="px-6 py-4 text-slate-600 dark:text-slate-400 font-num">${esc(c.phone || '—')}</td>
        <td class="px-6 py-4 text-slate-600 dark:text-slate-400 font-num">${fmt(c.credit_total || 0)} ${CURRENCY}</td>
        <td class="px-6 py-4 text-emerald-600 font-num">${fmt(c.paid_total || 0)} ${CURRENCY}</td>
        <td class="px-6 py-4 font-num font-bold">
          <span class="px-2.5 py-1 rounded-full text-xs ${debt > 0 ? 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400'}">
            ${debt > 0 ? fmt(debt) + ' ' + CURRENCY : 'خالص (0.00)'}
          </span>
        </td>
        <td class="px-6 py-4 text-center">
          <div class="flex justify-center gap-2">
            ${canEdit ? `<button onclick="editCustomer(${c.id}); event.stopPropagation()" class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors flex items-center justify-center" title="تعديل"><span class="material-icons-outlined text-sm">edit</span></button>` : ''}
            ${canDelete ? `<button onclick="deleteCustomer(${c.id}); event.stopPropagation()" class="w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors flex items-center justify-center" title="حذف"><span class="material-icons-outlined text-sm">delete</span></button>` : ''}
            <a href="customer_details.html?id=${c.id}" onclick="event.stopPropagation()" class="px-3 h-8 rounded-lg bg-purple-50 text-purple-600 hover:bg-purple-100 transition-colors flex items-center justify-center gap-1 text-xs font-bold" title="كشف الحساب وسندات القبض">
              <span class="material-icons-outlined text-sm">visibility</span>
              <span>كشف الحساب</span>
            </a>
          </div>
        </td>
      </tr>`;
    }).join('') : '<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400">لا يوجد عملاء مطابقين</td></tr>';
  }

  window.editCustomer = async (id) => {
    const c = await guard(() => api('customer', { id }));
    if (!c) return;
    
    $('modal-title').textContent = 'تعديل بيانات العميل';
    $('f-id').value = c.id;
    $('f-name').value = c.name;
    $('f-phone').value = c.phone || '';
    $('cust-modal').classList.replace('hidden', 'flex');
  };

  window.deleteCustomer = async (id) => {
    if (!confirm('هل أنت متأكد من حذف هذا العميل؟')) return;
    if (await guard(() => api('customers_delete', { id }))) {
      toast('تم حذف العميل');
      loadCustomers();
    }
  };

  $('btn-add').addEventListener('click', () => {
    $('modal-title').textContent = 'إضافة عميل جديد';
    $('f-id').value = '';
    $('f-name').value = '';
    $('f-phone').value = '';
    $('cust-modal').classList.replace('hidden', 'flex');
  });

  $('modal-cancel').addEventListener('click', () => {
    $('cust-modal').classList.replace('flex', 'hidden');
  });

  $('cust-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await guard(() => api('customers_save', {
      id: $('f-id').value || null,
      name: $('f-name').value,
      phone: $('f-phone').value
    }));
    if (res) {
      toast('تم حفظ بيانات العميل');
      $('cust-modal').classList.replace('flex', 'hidden');
      loadCustomers();
    }
  });

  $('q').addEventListener('input', () => { currentOffset = 0; loadCustomers(); });
  $('debt-only').addEventListener('change', () => { currentOffset = 0; loadCustomers(); });

  $('prev').addEventListener('click', () => {
    if (currentOffset >= LIMIT) { currentOffset -= LIMIT; loadCustomers(); }
  });
  $('next').addEventListener('click', () => {
    if (currentOffset + LIMIT < lastTotal) { currentOffset += LIMIT; loadCustomers(); }
  });

  loadCustomers();
})();
</script>
</body></html>
