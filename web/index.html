<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>تسجيل الدخول - تك زون للإلكترونيات</title>
<link href="app.css" rel="stylesheet"/>
<script>if(localStorage.getItem('tz-theme')==='dark')document.documentElement.classList.add('dark');</script>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
<!-- Main Container -->
<main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
<!-- Left Side: Branding & Illustration (Visible on Desktop) -->
<div class="hidden lg:flex flex-col justify-center items-start space-y-8 p-8">
<div class="space-y-4">
<div class="flex items-center gap-3">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/30">
<span class="material-icons-round text-white text-3xl">memory</span>
</div>
<h1 class="text-3xl font-bold text-slate-800 dark:text-white font-arabic tracking-wide">تك زون للإلكترونيات</h1>
</div>
<p class="text-slate-500 dark:text-slate-400 text-lg leading-relaxed max-w-md font-arabic">
نظام متكامل لإدارة المبيعات والصيانة. الحل الأمثل لمحلات الكمبيوتر والأنظمة الأمنية.
</p>
</div>
<!-- Hero Card (زخرفة CSS محلية بدل صورة الشبكة) -->
<div class="w-full h-80 rounded-2xl overflow-hidden relative shadow-2xl shadow-primary/10 border border-slate-200 dark:border-slate-700 group">
<div class="absolute inset-0" style="background:
  radial-gradient(circle at 20% 30%, rgba(19,127,236,.45), transparent 45%),
  radial-gradient(circle at 80% 70%, rgba(19,127,236,.30), transparent 45%),
  repeating-linear-gradient(0deg, transparent 0 23px, rgba(19,127,236,.22) 23px 24px),
  repeating-linear-gradient(90deg, transparent 0 23px, rgba(19,127,236,.22) 23px 24px),
  linear-gradient(160deg, #0b1220 0%, #101922 60%, #0f66bd 160%);"></div>
<div class="absolute w-24 h-24 rounded-xl border-2 border-primary/40 top-8 left-10 rotate-12"></div>
<div class="absolute w-14 h-14 rounded-full border-2 border-primary/30 bottom-16 right-12"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10 flex items-end p-6">
<div class="text-white z-20">
<div class="flex items-center gap-2 mb-2">
<span class="bg-green-500 w-2 h-2 rounded-full animate-pulse"></span>
<span class="text-sm font-medium opacity-90">النظام يعمل بكفاءة</span>
</div>
<p class="text-sm opacity-80 font-numeric">v2.4.0 (Offline)</p>
</div>
</div>
</div>
</div>
<!-- Right Side: Login Card -->
<div class="w-full max-w-md mx-auto">
<div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-black/20 overflow-hidden border border-slate-100 dark:border-slate-800 relative">
<!-- Decoration -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full -mr-8 -mt-8 pointer-events-none"></div>
<div class="p-8 pb-6">
<!-- Mobile Logo (Visible only on small screens) -->
<div class="lg:hidden flex justify-center mb-6">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shadow-md">
<span class="material-icons-round text-white text-2xl">memory</span>
</div>
</div>
<div class="text-center mb-6">
<h2 class="text-2xl font-bold text-slate-800 dark:text-white mb-2 font-arabic">تسجيل الدخول</h2>
<p class="text-slate-500 dark:text-slate-400 font-arabic">الرجاء إدخال الرمز السري للموظف</p>
</div>
<!-- User Selector -->
<div id="users" class="flex gap-2 justify-center mb-6 flex-wrap"></div>
<!-- PIN Display -->
<div class="mb-8">
<div class="bg-slate-50 dark:bg-slate-900 border-2 border-primary/30 focus-within:border-primary rounded-xl h-16 flex items-center justify-center transition-all duration-300 shadow-inner">
<div class="flex gap-4" dir="ltr" id="dots"></div>
</div>
</div>
<!-- Keypad Grid -->
<div class="grid grid-cols-3 gap-4 mb-8 font-numeric" dir="ltr" id="keypad">
<button data-key="1" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">1</button>
<button data-key="2" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">2</button>
<button data-key="3" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">3</button>
<button data-key="4" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">4</button>
<button data-key="5" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">5</button>
<button data-key="6" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">6</button>
<button data-key="7" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">7</button>
<button data-key="8" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">8</button>
<button data-key="9" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">9</button>
<button data-key="del" class="h-16 rounded-xl bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/30 text-red-500 dark:text-red-400 transition-colors shadow-sm active:scale-95 flex items-center justify-center">
<span class="material-icons-round text-2xl">backspace</span>
</button>
<button data-key="0" class="h-16 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl font-semibold text-slate-700 dark:text-slate-200 transition-colors shadow-sm active:scale-95">0</button>
<button data-key="ok" class="h-16 rounded-xl bg-primary hover:bg-primary-dark text-white transition-colors shadow-lg shadow-primary/30 active:scale-95 flex items-center justify-center">
<span class="material-icons-round text-3xl transform rotate-180">login</span>
</button>
</div>
<!-- Admin Link -->
<div class="flex justify-center pt-2 border-t border-slate-100 dark:border-slate-800">
<button id="admin-btn" class="group flex items-center gap-2 px-4 py-2 rounded-lg text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-primary transition-colors">
<span class="material-icons-round text-sm group-hover:scale-110 transition-transform">admin_panel_settings</span>
<span class="text-sm font-medium font-arabic">دخول المدير</span>
</button>
</div>
</div>
<!-- Card Footer Status -->
<div class="bg-slate-50 dark:bg-slate-900/50 p-3 flex justify-between items-center text-xs text-slate-400 border-t border-slate-100 dark:border-slate-800">
<span class="font-numeric">ID: Term-04</span>
<span class="flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-green-500"></span>
متصل بالنظام المحلي
</span>
</div>
</div>
<!-- Footer Copyright -->
<div class="mt-8 text-center">
<p class="text-slate-400 dark:text-slate-600 text-sm font-arabic">جميع الحقوق محفوظة © تك زون</p>
</div>
</div>
</main>
<!-- Theme Button (Fixed) -->
<button onclick="toggleTheme()" class="fixed bottom-6 right-6 lg:bottom-8 lg:right-8 bg-surface-light dark:bg-surface-dark p-3 rounded-full shadow-lg border border-slate-200 dark:border-slate-700 text-primary hover:bg-primary hover:text-white transition-all duration-300 z-50 group">
<span class="material-icons-round block dark:hidden">dark_mode</span>
<span class="material-icons-round hidden dark:block">light_mode</span>
</button>
<script src="app.js"></script>
<script>
let PIN = '', USERNAME = 'cashier', USERS = [];

function renderDots() {
  document.getElementById('dots').innerHTML = [0, 1, 2, 3].map((i) =>
    `<div class="w-4 h-4 rounded-full transition-colors ${i < PIN.length ? 'bg-slate-800 dark:bg-white animate-pulse' : 'bg-slate-300 dark:bg-slate-700'}"></div>`).join('');
}
function renderUsers() {
  document.getElementById('users').innerHTML = USERS.map((u) =>
    `<button data-u="${u.username}" class="px-4 py-2 rounded-xl text-sm font-medium border transition-all ${u.username === USERNAME ? 'bg-primary text-white border-primary shadow-lg shadow-primary/30' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}">
      <span class="material-icons-round text-base align-middle">person</span> ${esc(u.name)}${u.role === 'admin' ? ' (مدير)' : ''}</button>`).join('');
  document.querySelectorAll('#users button').forEach((b) => b.addEventListener('click', () => { USERNAME = b.dataset.u; renderUsers(); }));
}
async function submit() {
  if (PIN.length !== 4) { toast('الرمز السري مكوّن من 4 أرقام', 'warn'); return; }
  const u = await guard(() => api('login', { username: USERNAME, pin: PIN }));
  if (u) location.href = 'pos.html';
  PIN = ''; renderDots();
}
document.getElementById('keypad').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.key;
  if (k === 'del') PIN = PIN.slice(0, -1);
  else if (k === 'ok') { submit(); return; }
  else if (PIN.length < 4) PIN += k;
  renderDots();
});
document.getElementById('admin-btn').addEventListener('click', () => { USERNAME = 'admin'; renderUsers(); });
document.addEventListener('keydown', (e) => {
  if (e.key >= '0' && e.key <= '9' && PIN.length < 4) { PIN += e.key; renderDots(); }
  else if (e.key === 'Backspace') { PIN = PIN.slice(0, -1); renderDots(); }
  else if (e.key === 'Enter') submit();
});
(async () => {
  USERS = (await guard(() => api('users'))) || [];
  if (!USERS.some((u) => u.username === USERNAME)) USERNAME = (USERS[0] || {}).username;
  renderUsers(); renderDots();
})();
</script>
</body></html>
