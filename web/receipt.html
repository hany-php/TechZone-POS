<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>معاينة وطباعة الإيصال - تك زون للإلكترونيات</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="icon" type="image/png" href="icon.png"/>
<link href="app.css" rel="stylesheet"/>
<script>if(localStorage.getItem('tz-theme')==='dark')document.documentElement.classList.add('dark');</script>
<style>
@page { margin: 0; }
@media print {
  @page { margin: 0; }
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  body > *:not(main) { display: none !important; }
  main { padding: 0 !important; margin: 0 !important; display: block !important; }
  main > div { max-width: none !important; margin: 0 !important; }
  main > div > *:not(.grid) { display: none !important; }
  div.grid { display: block !important; }
  div.grid > *:not(section:first-child) { display: none !important; }
  section:first-child > div { border: 0 !important; border-radius: 0 !important; padding: 0 !important; background: #fff !important; }
  section:first-child h2 { display: none !important; }
  #paper { position: static !important; width: 80mm !important; max-width: 80mm !important; margin: 0 auto !important; box-shadow: none !important; border-radius: 0 !important; overflow: visible !important; color: #000 !important; }
  aside.tz-nav, .no-print { display: none !important; }
}
</style>
</head>
<body id="shell" class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col md:flex-row">
<main class="flex-1 min-w-0 p-4 md:p-8">
<div class="w-full">
<!-- Header -->
<div class="flex flex-wrap justify-between items-center gap-3 mb-6">
<div>
<h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">معاينة وطباعة الإيصال</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm" id="inv-line">اختر فاتورة لعرضها وطباعتها</p>
</div>
<div class="flex items-center gap-2 no-print">
<a href="settings.html?tab=invoices" class="px-4 py-2 rounded-xl bg-primary/10 text-primary hover:bg-primary hover:text-white text-xs font-bold flex items-center gap-1.5 transition-colors">
  <span class="material-icons-round text-base">settings</span>
  <span>تعديل إعدادات المتجر وتصميم الفاتورة</span>
</a>
<button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 transition-colors" title="تبديل الوضع الليلي / النهاري">
  <span class="material-icons-outlined dark:hidden">dark_mode</span>
  <span class="material-icons-outlined hidden dark:inline">light_mode</span>
</button>
</div>
</div>
<div id="no-id" class="hidden mb-6 p-4 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 text-amber-800 dark:text-amber-200 text-sm font-medium">لا توجد فاتورة محددة للعرض — افتح الإيصال من سجل المبيعات أو نقاط البيع، أو انتقل إلى «إعدادات النظام» لتخصيص شكل الفواتير.</div>
<div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
<!-- Preview column -->
<section class="xl:col-span-1">
<div class="bg-gray-50 dark:bg-[#15202b] rounded-2xl border border-gray-200 dark:border-gray-800 p-6 relative overflow-hidden">
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;"></div>
<h2 class="text-sm uppercase tracking-wider text-gray-500 font-semibold mb-4 flex items-center gap-2">
<span class="material-icons-outlined text-base">receipt_long</span>
معاينة الإيصال الحراري
</h2>
<div id="paper" class="bg-white text-black shadow-lg rounded-sm w-full flex flex-col relative overflow-y-auto font-mono text-sm leading-tight pb-6 p-5"></div>
</div>
</section>
<!-- Invoice Details & Print Actions column -->
<div class="xl:col-span-2 flex flex-col gap-6 no-print">
<section class="bg-white dark:bg-surface-dark rounded-2xl border border-gray-100 dark:border-gray-800 p-6 md:p-8">
<div class="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-6 mb-6 flex justify-between items-center border border-blue-100 dark:border-blue-800">
<span class="text-gray-600 dark:text-gray-300 font-medium text-lg">المبلغ الإجمالي</span>
<div class="text-right">
<span class="text-4xl font-bold text-primary font-numbers" id="gtotal">0.00</span>
<span class="text-primary/70 text-sm font-medium mr-1" id="cur">ج.م</span>
</div>
</div>
<div class="space-y-3 mb-6 text-sm" id="info"></div>
<div class="mb-6">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">طرق الدفع المسجلة</label>
<div class="space-y-2" id="pays"></div>
</div>
<div class="mt-auto pt-6 border-t border-gray-100 dark:border-gray-800 flex flex-wrap gap-3">
<button id="btn-print-thermal" type="button" class="flex-1 bg-primary hover:bg-primary-dark text-white py-4 px-4 rounded-xl font-bold text-base shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
<span class="material-icons-outlined">print</span>
طباعة إيصال كاشير حراري
</button>
<button id="btn-print-a4" type="button" class="px-5 py-4 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold flex items-center gap-2 transition-colors shadow-lg">
<span class="material-icons-outlined">description</span>
طباعة فاتورة A4 رسمية
</button>
<button id="btn-wa" type="button" data-wa-toggle class="px-5 py-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold flex items-center gap-2 transition-colors shadow-lg shadow-emerald-600/20">
<span class="material-icons-outlined">send</span>
إرسال ملف PDF عبر واتساب
</button>
<button id="btn-text" class="px-4 py-4 rounded-xl border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-semibold hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-2 transition-colors">
<span class="material-icons-outlined">receipt</span>
نص حراري
</button>
</div>
<pre id="raw" dir="ltr" class="hidden mt-4 text-[10px] leading-tight bg-slate-900 text-green-100 p-4 rounded-xl overflow-x-auto"></pre>
</section>
</div>
</div>
</div>
</main>
<script src="app.js"></script>
<script>
(async () => {
  const user = await pageInit('receipt');
  if (!user) return;
  let sale = null;
  let id = new URLSearchParams(location.search).get('id');
  let tplsLoaded = null;
  try { tplsLoaded = await api('templates_get'); } catch (e) {}
  const posCfg = (tplsLoaded && tplsLoaded.pos) || {};
  const a4Cfg = (tplsLoaded && tplsLoaded.a4) || {};

  if (posCfg.paper_width === '58mm') {
    document.getElementById('paper').style.maxWidth = '58mm';
    document.getElementById('paper').style.margin = '0 auto';
  }

  function renderPaper() {
    document.getElementById('paper').innerHTML = buildPosThermalReceiptHtml(sale || {}, posCfg, SETTINGS);
  }

  renderPaper();
  if (!id) {
    const latest = await guard(() => api('sales', { kind: 'sale', limit: 1, offset: 0 }));
    if (latest && latest.rows && latest.rows.length) {
      id = latest.rows[0].id;
    } else {
      document.getElementById('no-id').classList.remove('hidden');
      return;
    }
  }
  const s = await guard(() => api('sale', { id: +id }));
  if (!s) return;
  sale = s;
  document.getElementById('cur').textContent = CURRENCY;
  document.getElementById('inv-line').textContent = `فاتورة ${s.invoice_no} — ${fmtDT(s.created_at)}`;
  document.getElementById('gtotal').textContent = fmt(s.total);
  document.getElementById('info').innerHTML = `
    <div class="flex justify-between"><span class="text-slate-500">الكاشير</span><span class="font-bold">${esc(s.user_name)}</span></div>
    ${s.customer_name ? `<div class="flex justify-between"><span class="text-slate-500">العميل</span><span class="font-bold">${esc(s.customer_name)}${s.customer_phone ? ' — ' + esc(s.customer_phone) : ''}</span></div>` : ''}
    ${s.notes ? `<div class="flex justify-between"><span class="text-slate-500">ملاحظات</span><span class="font-medium">${esc(s.notes)}</span></div>` : ''}
    <div class="flex justify-between"><span class="text-slate-500">الحالة</span><span class="font-bold">${s.status === 'returned' ? 'فاتورة مرتجع كلي' : s.status === 'partial_return' ? 'فاتورة مرتجع جزئي / معدلة' : 'فاتورة بيع مكتملة'}</span></div>
    ${s.modified_by_name ? `<div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 text-xs space-y-1">
      <div class="font-bold text-orange-700 dark:text-amber-300">سجل الرقابة والتعديلات على الفاتورة:</div>
      <div>آخر تعديل/مرتجع بواسطة: <b>${esc(s.modified_by_name)}</b> — بتاريخ: <b class="font-num">${fmtDT(s.modified_at)}</b></div>
      ${s.modification_summary ? `<div class="text-slate-600 dark:text-slate-300">${esc(s.modification_summary)}</div>` : ''}
    </div>` : ''}`;
  const AR = { cash: 'نقدي', wallet: 'محفظة إلكترونية', credit: 'آجل (مديونية)' };
  document.getElementById('pays').innerHTML = s.payments.map((p) => `
    <div class="flex justify-between items-center p-3 rounded-xl border border-slate-200 dark:border-slate-700">
      <div>
        <span class="font-medium">${AR[p.method] || p.method}</span>
        ${p.ref_no ? `<span class="text-xs px-2 py-0.5 rounded bg-blue-50 dark:bg-blue-900/30 text-blue-600 font-numbers mr-2">مرجع العملية: ${esc(p.ref_no)}</span>` : ''}
      </div>
      <span class="font-numeric font-bold">${fmt(p.amount)} ${CURRENCY}${p.change ? ` <span class="text-xs text-green-600">(الباقي ${fmt(p.change)})</span>` : ''}</span>
    </div>`).join('');
  renderPaper();

  document.getElementById('btn-print-thermal').addEventListener('click', () => {
    const mode = posCfg.paper_width === '58mm' ? '58mm' : 'thermal';
    if (window.parent && window.parent !== window && window.parent.TZOS && window.parent.TZOS.printHtml) {
      window.parent.TZOS.printHtml(document.getElementById('paper').innerHTML, mode);
    } else {
      window.print();
    }
  });

  document.getElementById('btn-print-a4').addEventListener('click', () => {
    if (!sale) return;
    const htmlA4 = buildA4InvoiceHtml(sale, a4Cfg);
    if (window.parent && window.parent !== window && window.parent.TZOS && window.parent.TZOS.printHtml) {
      window.parent.TZOS.printHtml(htmlA4, 'a4');
    } else {
      const w = window.open('', '_blank');
      if (w) {
        w.document.write('<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>@page{size:A4 portrait;margin:0}body{margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.tz-a4-sheet{box-shadow:none!important;margin:0 auto!important}</style></head><body>' + htmlA4 + '</body></html>');
        w.document.close();
        setTimeout(() => w.print(), 150);
      }
    }
  });

  document.getElementById('btn-wa').addEventListener('click', async () => {
    if (!sale) return;
    await sendInvoicePdfToWhatsapp(sale.id, sale.customer_phone || '');
  });
  document.getElementById('btn-text').addEventListener('click', async () => {
    const t = await guard(() => api('receipt_text', { id: +id }));
    if (t == null) return;
    const r = document.getElementById('raw');
    r.textContent = t; r.classList.toggle('hidden');
  });
})();
</script>
</body></html>
